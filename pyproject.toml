[project]
name = "rls-razor-reprod"
version = "0.1.0"
description = "GRPO vs SFT forgetting on tool use, after RL's Razor (Shenfeld et al., 2025)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets==5.0.1",
    "liger-kernel==0.8.3",
    "lm-eval[ifeval]==0.4.13",
    "orch",
    "torch==2.13.0",
    "transformers==5.17.0",
    "trl==1.13.0",
    "vllm==0.30.0",
    "wandb>=0.30.0",
]

[tool.uv.sources]
orch = { git = "https://github.com/thomas-woehrle/orch", tag = "v0.2.0" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rls_razor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
