# SFT learning-rate sweep, Qwen2.5-1.5B-Instruct, plus the base-model evals
# that anchor both frontiers. Four of the paper's five values, spanning the
# range. Run locally: orch run experiments/tooluse_sft_lr.yaml --cluster local
version: 1
description: SFT tool-use learning-rate sweep and base evals, 1.5B.
runs:
  - { config: configs/eval/tooluse.yaml, model: "hf:Qwen/Qwen2.5-1.5B-Instruct" }
  - { config: configs/eval/prior_tasks.yaml, model: "hf:Qwen/Qwen2.5-1.5B-Instruct" }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 1.0e-5 } }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 3.0e-5 } }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 5.0e-5 } }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 9.0e-5 } }
tags: ["exp:rlsrazor-tooluse-lr"]
