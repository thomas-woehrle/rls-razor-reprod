# SFT learning-rate sweep, Qwen2.5-1.5B-Instruct, plus the base-model evals
# that anchor the frontier. Four of the paper's five values, spanning the
# range. Held evals inherit each run's tags. The base evals also appear in
# tooluse_grpo_lr.yaml; whichever file runs first submits them.
# Run locally: orch run experiments/tooluse_sft_lr.yaml --cluster local
version: 1
description: SFT tool-use learning-rate sweep and base evals, 1.5B.
runs:
  - { config: configs/eval/tooluse.yaml, model: "hf:Qwen/Qwen2.5-1.5B-Instruct", tags: ["method:base"] }
  - { config: configs/eval/prior_tasks.yaml, model: "hf:Qwen/Qwen2.5-1.5B-Instruct", tags: ["method:base"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 1.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 3.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 5.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.learning_rate: 9.0e-5 }, tags: ["method:sft"] }
tags: ["exp:rlsrazor-tooluse-lr"]
