# SFT sweep, Qwen2.5-1.5B-Instruct, plus the base-model evals that anchor the
# frontier. Table 2 sweeps learning rate, constant vs cosine, 1 vs 2 epochs,
# and batch size {16, 32, 64, 128}. The reference slice is cosine, 2 epochs,
# batch 32. Each other block changes one of those and crosses it with all five
# learning rates. Batch size is per_device 4 times gradient_accumulation_steps
# (4, 8, 16, 32). Warmup stays 50 steps, as in the table. Weight decay and max
# grad norm stay at 0 and 1; the paper tried them and saw no effect.
# Held evals inherit each run's tags. The base evals also appear in
# tooluse_grpo_lr.yaml; whichever file runs first submits them.
# Run locally: orch run experiments/tooluse_sft_lr.yaml --cluster local
version: 1
description: SFT tool-use hyperparameter sweep and base evals, 1.5B.
runs:
  # Reference: cosine, 2 epochs, batch 32.
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 1.0e-5 },
      tags: ["method:sft"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 3.0e-5 },
      tags: ["method:sft"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 5.0e-5 },
      tags: ["method:sft"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 7.0e-5 },
      tags: ["method:sft"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 9.0e-5 },
      tags: ["method:sft"],
    }
  # Constant with warmup, 2 epochs, batch 32.
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 1.0e-5,
          params.lr_scheduler_type: constant_with_warmup,
        },
      tags: ["method:sft", "sched:constant"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 3.0e-5,
          params.lr_scheduler_type: constant_with_warmup,
        },
      tags: ["method:sft", "sched:constant"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 5.0e-5,
          params.lr_scheduler_type: constant_with_warmup,
        },
      tags: ["method:sft", "sched:constant"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 7.0e-5,
          params.lr_scheduler_type: constant_with_warmup,
        },
      tags: ["method:sft", "sched:constant"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 9.0e-5,
          params.lr_scheduler_type: constant_with_warmup,
        },
      tags: ["method:sft", "sched:constant"],
    }
  # Cosine, 1 epoch, batch 32.
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 1.0e-5, params.num_train_epochs: 1 },
      tags: ["method:sft", "epochs:1"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 3.0e-5, params.num_train_epochs: 1 },
      tags: ["method:sft", "epochs:1"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 5.0e-5, params.num_train_epochs: 1 },
      tags: ["method:sft", "epochs:1"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 7.0e-5, params.num_train_epochs: 1 },
      tags: ["method:sft", "epochs:1"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set: { params.learning_rate: 9.0e-5, params.num_train_epochs: 1 },
      tags: ["method:sft", "epochs:1"],
    }
  # Cosine, 2 epochs, batch 16 (grad accum 4).
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        { params.learning_rate: 1.0e-5, params.gradient_accumulation_steps: 4 },
      tags: ["method:sft", "bs:16"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        { params.learning_rate: 3.0e-5, params.gradient_accumulation_steps: 4 },
      tags: ["method:sft", "bs:16"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        { params.learning_rate: 5.0e-5, params.gradient_accumulation_steps: 4 },
      tags: ["method:sft", "bs:16"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        { params.learning_rate: 7.0e-5, params.gradient_accumulation_steps: 4 },
      tags: ["method:sft", "bs:16"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        { params.learning_rate: 9.0e-5, params.gradient_accumulation_steps: 4 },
      tags: ["method:sft", "bs:16"],
    }
  # Cosine, 2 epochs, batch 64 (grad accum 16).
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 1.0e-5,
          params.gradient_accumulation_steps: 16,
        },
      tags: ["method:sft", "bs:64"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 3.0e-5,
          params.gradient_accumulation_steps: 16,
        },
      tags: ["method:sft", "bs:64"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 5.0e-5,
          params.gradient_accumulation_steps: 16,
        },
      tags: ["method:sft", "bs:64"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 7.0e-5,
          params.gradient_accumulation_steps: 16,
        },
      tags: ["method:sft", "bs:64"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 9.0e-5,
          params.gradient_accumulation_steps: 16,
        },
      tags: ["method:sft", "bs:64"],
    }
  # Cosine, 2 epochs, batch 128 (grad accum 32).
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 1.0e-5,
          params.gradient_accumulation_steps: 32,
        },
      tags: ["method:sft", "bs:128"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 3.0e-5,
          params.gradient_accumulation_steps: 32,
        },
      tags: ["method:sft", "bs:128"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 5.0e-5,
          params.gradient_accumulation_steps: 32,
        },
      tags: ["method:sft", "bs:128"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 7.0e-5,
          params.gradient_accumulation_steps: 32,
        },
      tags: ["method:sft", "bs:128"],
    }
  - {
      config: configs/train/sft_tooluse.yaml,
      set:
        {
          params.learning_rate: 9.0e-5,
          params.gradient_accumulation_steps: 32,
        },
      tags: ["method:sft", "bs:128"],
    }
tags: ["exp:rlsrazor-tooluse-lr"]
