# SFT learning-rate sweep, Qwen2.5-3B-Instruct. Four of the paper's five
# values. Epochs stay at the hparams default of 2; the 4-epoch half is the
# same file with --set params.num_train_epochs=4. Base-model evals are
# submitted on their own, so that override cannot reach them.
# Run locally: orch run experiments/tooluse_sft_lr_3b.yaml --cluster local
version: 1
description: SFT tool-use learning-rate sweep, 3B.
runs:
  - { config: configs/train/sft_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 1.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 3.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 5.0e-5 }, tags: ["method:sft"] }
  - { config: configs/train/sft_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 9.0e-5 }, tags: ["method:sft"] }
tags: ["exp:rlsrazor-tooluse-sft-3b"]
