# GRPO learning-rate sweep, Qwen2.5-3B-Instruct, num_iterations 2.
# Same setup as tooluse_grpo_lr_3b.yaml, limited to the rates at or below
# 1e-5: 3e-6, 5e-6, 7e-6, 9e-6, 1e-5. Group size stays 64.
# num_iterations 2 reuses each generation batch for a second optimizer step,
# so a run takes about twice as long as the matching num_iterations 1 run.
# On an L40S that is about 60h, past the 48h limit in grpo_tooluse.yaml.
# Run on eddie: orch run experiments/tooluse_grpo_lr_3b_2iters.yaml --cluster eddie
version: 1
description: GRPO tool-use learning-rate sweep, 3B, num_iterations 2.
runs:
  - { config: configs/train/grpo_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 3.0e-6, params.num_iterations: 2 }, tags: ["method:grpo"] }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 5.0e-6, params.num_iterations: 2 }, tags: ["method:grpo"] }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 7.0e-6, params.num_iterations: 2 }, tags: ["method:grpo"] }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 9.0e-6, params.num_iterations: 2 }, tags: ["method:grpo"] }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.model_name: "Qwen/Qwen2.5-3B-Instruct", params.learning_rate: 1.0e-5, params.num_iterations: 2 }, tags: ["method:grpo"] }
tags: ["exp:rlsrazor-tooluse-grpo-3b-iters2"]
