# GRPO learning-rate sweep, Qwen2.5-1.5B-Instruct. Four of the paper's five
# values. Run on eddie: orch run experiments/tooluse_grpo_lr.yaml --cluster eddie
version: 1
description: GRPO tool-use learning-rate sweep, 1.5B.
runs:
  - { config: configs/train/grpo_tooluse.yaml, set: { params.learning_rate: 1.0e-5 } }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.learning_rate: 2.0e-5 } }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.learning_rate: 3.0e-5 } }
  - { config: configs/train/grpo_tooluse.yaml, set: { params.learning_rate: 5.0e-5 } }
tags: ["exp:rlsrazor-tooluse-lr"]
