# GRPO on tool use, following Table 2 of the paper: binary reward, no KL term,
# Dr. GRPO loss, group size 64, 8 prompts per generation, constant LR with
# 50 warmup steps, one epoch. The paper sweeps learning_rate over
# {1e-5, ..., 5e-5} and num_iterations over {1, 2}.
# per_device_train_batch_size * gradient_accumulation_steps = 512 = 8 * 64.
# steps_per_generation is left unset, so it equals gradient_accumulation_steps
# and every optimizer step consumes exactly one fresh generation batch.
# runtime_keys change how a run fits on a GPU, not the experiment identity.
runtime_keys:
  - vllm_mode
  - vllm_gpu_memory_utilization
  - vllm_enable_sleep_mode
  - vllm_max_model_length
  - use_liger_kernel
  - gradient_checkpointing
  - logging_steps

method: grpo
model_name: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
train_data: data/tooluse_data/train_data
seed: 42
bf16: true
learning_rate: 1.0e-5
lr_scheduler_type: constant_with_warmup
warmup_steps: 50
weight_decay: 0.0
max_grad_norm: 1.0
num_train_epochs: 1
per_device_train_batch_size: 8
gradient_accumulation_steps: 64
num_generations: 64
num_iterations: 1
beta: 0.0
loss_type: dr_grpo
# Dr. GRPO does not divide advantages by the group standard deviation.
scale_rewards: none
temperature: 1.0
max_completion_length: 1024
use_vllm: true

vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3
vllm_enable_sleep_mode: true
# Longest prompt is ~1.5k tokens, plus max_completion_length.
vllm_max_model_length: 3072
use_liger_kernel: true
gradient_checkpointing: true
logging_steps: 1
