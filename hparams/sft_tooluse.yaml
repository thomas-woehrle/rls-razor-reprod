# SFT on the ToolAlpaca golden responses, from the paper's Table 2 grid:
# learning_rate in {1e-5, 3e-5, 5e-5, 7e-5, 9e-5}, constant or cosine with
# 50 warmup steps, 1 or 2 epochs, batch size in {16, 32, 64, 128}.
# This file fixes cosine, 2 epochs, and batch size 32 (4 * 8).
# completion_only_loss and packing are identity-bearing: they change what the
# loss is computed on. runtime_keys are technical knobs.
runtime_keys:
  # Kernel, memory, and logging choices. They do not change the SFT update.
  - use_liger_kernel
  - gradient_checkpointing
  - logging_steps

method: sft
model_name: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
train_data: data/tooluse_data/train_data
seed: 42
bf16: true
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_steps: 50
weight_decay: 0.0
max_grad_norm: 1.0
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
# Longest prompt plus longest golden response is under 3k tokens.
max_length: 3072
completion_only_loss: true
packing: false

use_liger_kernel: true
gradient_checkpointing: true
logging_steps: 1
